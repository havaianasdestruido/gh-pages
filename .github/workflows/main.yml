name: Index repo websites

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: # manual run button

permissions:
  contents: write # needed to commit URL.MD

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      # PAT needed: GITHUB_TOKEN can't list your other repos (or private ones)
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repos and build URL.MD
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret GH_PAT is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          rows=""
          count=0

          # .homepage is the "Website" field shown on the repo page, and it's
          # included in the list response — so this is one paginated call,
          # no per-repo requests at all.
          while IFS=$'\t' read -r repo url; do
            [ -z "$repo" ] && continue

            # GitHub shows the value verbatim; make sure it renders as a link
            case "$url" in
              http://*|https://*) ;;
              *) url="https://$url" ;;
            esac

            echo "✔ $repo -> $url"
            rows+="| [$repo](https://github.com/$repo) | <$url> |"$'\n'
            count=$((count + 1))
          done < <(
            gh api --paginate "user/repos?affiliation=owner&per_page=100" \
              --jq '.[]
                    | select(.archived | not)
                    | (.homepage // "" | gsub("^\\s+|\\s+$"; "")) as $url
                    | select($url != "")
                    | [.full_name, $url]
                    | @tsv' | sort
          )

          {
            echo "# Repo websites"
            echo
            echo "Auto-generated weekly. Repos with a website URL set on their repo page: **$count**"
            echo
            echo "| Repo | URL |"
            echo "|------|-----|"
            printf '%s' "$rows"
          } > URL.MD

      - name: Commit URL.MD if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add URL.MD
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update URL.MD (repo website index)"
            git push
          fi
