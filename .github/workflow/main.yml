name: Index GitHub Pages sites

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: # manual run button

permissions:
  contents: write # needed to commit URL.MD

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      # PAT needed: GITHUB_TOKEN can't read other repos (or private ones)
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repos and build URL.MD
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret GH_PAT is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          # If a workflow mentions any of these, it's probably NOT plain static HTML
          OTHER_BUILD='hugo|astro|next|vite|npm |yarn|pnpm|mkdocs|gatsby|docusaurus|sphinx|eleventy|mdbook|bundle exec|flutter|cargo|dotnet'

          rows=""
          count=0

          while read -r repo; do
            [ -z "$repo" ] && continue

            # 404 => Pages not enabled
            pages=$(gh api "repos/$repo/pages" 2>/dev/null) || continue
            url=$(jq -r '.html_url // empty' <<<"$pages")
            [ -z "$url" ] && continue
            build=$(jq -r '.build_type // "legacy"' <<<"$pages")

            # Collect workflow file contents (if any)
            wf=""
            files=$(gh api "repos/$repo/contents/.github/workflows" --jq '.[].name' 2>/dev/null || true)
            for f in $files; do
              wf+=$(gh api "repos/$repo/contents/.github/workflows/$f" \
                    -H "Accept: application/vnd.github.raw" 2>/dev/null || true)$'\n'
            done

            kind=""
            if grep -q 'actions/jekyll-build-pages' <<<"$wf"; then
              kind="Jekyll"
            elif [ "$build" = "legacy" ]; then
              # Deploy from branch: Jekyll if _config.yml exists, else plain static
              if gh api "repos/$repo/contents/_config.yml" >/dev/null 2>&1; then
                kind="Jekyll"
              else
                kind="Static HTML"
              fi
            elif grep -q 'actions/upload-pages-artifact' <<<"$wf" && ! grep -qiE "$OTHER_BUILD" <<<"$wf"; then
              kind="Static HTML"
            fi

            [ -z "$kind" ] && continue

            echo "✔ $repo ($kind) -> $url"
            rows+="| [$repo](https://github.com/$repo) | $kind | <$url> |"$'\n'
            count=$((count + 1))
          done < <(gh api --paginate "user/repos?affiliation=owner&per_page=100" \
                     --jq '.[] | select(.archived | not) | .full_name' | sort)

          {
            echo "# GitHub Pages sites"
            echo
            echo "Auto-generated weekly. Repos using Jekyll or static HTML Pages: **$count**"
            echo
            echo "| Repo | Type | URL |"
            echo "|------|------|-----|"
            printf '%s' "$rows"
          } > URL.MD

      - name: Commit URL.MD if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add URL.MD
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update URL.MD (GitHub Pages index)"
            git push
          fi
